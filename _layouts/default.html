<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
:root{color-scheme:light;--ink:#172c3e;--accent:#145c66;--muted:#526477}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4f7f9;font:17px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#fff;border-bottom:1px solid #d6e0e7}nav{max-width:1080px;margin:auto;padding:20px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}nav .brand{font-weight:750;margin-right:auto}
a{color:var(--accent);text-underline-offset:4px}nav a{text-decoration:none}nav a:hover,nav a:focus-visible{text-decoration:underline}
main{max-width:1000px;margin:36px auto;padding:36px 44px;background:#fff;border:1px solid #dce5eb;border-radius:12px}
h1{font-size:2.25rem;line-height:1.2;margin:0 0 24px}h2{font-size:1.4rem;margin-top:32px}h3{font-size:1.15rem}p,li{max-width:80ch}li{margin:9px 0}
table{border-collapse:collapse;width:100%;font-size:.94rem;display:block;overflow:auto}th,td{text-align:left;vertical-align:top;padding:13px;border:1px solid #d6e0e7}th{background:#edf4f5}
iframe{display:block;width:100%;aspect-ratio:16/9;border:1px solid #d6e0e7;border-radius:8px}footer{max-width:1000px;margin:20px auto 40px;padding:0 28px;color:var(--muted);font-size:.9rem}
pre{overflow:auto;background:#f0f4f7;padding:18px}a:focus-visible{outline:3px solid #dfac30;outline-offset:4px}
@media(max-width:640px){main{margin:16px 12px;padding:24px 20px}nav{padding:16px 20px;gap:12px}nav .brand{width:100%}h1{font-size:1.8rem}}

.artifact-showcase .eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:12px}
.artifact-showcase h1{font-size:3rem;margin-bottom:16px}.artifact-showcase .lead{font-size:1.3rem;line-height:1.5;max-width:42ch}.artifact-showcase section{margin-top:48px}.artifact-showcase section h2{margin:0 0 22px;line-height:1.35}
.comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.comparison-card{padding:26px;border:1px solid #d6e0e7;border-radius:12px;background:#f8fafb}.comparison-card.after{background:#eef7f5;border-color:#b4d4cc}.comparison-card h3{margin:12px 0}.stage{font-size:.8rem;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:#526477}.after .stage{color:#145c66}.comparison-card ul{padding-left:20px}.text-link{font-weight:650}
.enhancement-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.enhancement-card{padding:24px;border:1px solid #d6e0e7;border-radius:12px;display:flex;flex-direction:column}.enhancement-card .number{font-size:1.8rem;color:#145c66;font-weight:750}.enhancement-card h3{line-height:1.4;margin:12px 0}.enhancement-card p{font-size:.94rem}.enhancement-card .skill{font-size:.8rem;color:var(--muted);margin-top:auto}.action{display:inline-flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:#145c66;color:white;border-radius:7px;text-decoration:none;font-size:.9rem;font-weight:650}.action:hover{background:#0d454d}.action.secondary{background:white;color:#145c66;border:1px solid #b7cbd0}.action.secondary:hover{background:#edf4f5}
.code-comparison figure{margin:0;min-width:0}.code-comparison figcaption{font-size:.85rem;font-weight:650;margin-bottom:10px}.code-comparison pre{margin:0;border-radius:8px;font:12px/1.65 Consolas,monospace;max-height:420px;overflow:auto;background:#152a38;color:#e3eef2}
.evidence-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.evidence-grid article{border:1px solid #d6e0e7;border-radius:10px;padding:20px 16px}.evidence-grid strong{display:block;font-size:1.65rem;color:#145c66}.evidence-grid span{display:block;font-size:.83rem;line-height:1.5;color:var(--muted);margin-top:6px}.validation-detail{margin-top:24px}.validation-detail p{font-size:.94rem}.project-files{border-top:1px solid #d6e0e7;padding-top:30px}.file-actions{display:flex;flex-wrap:wrap;gap:12px}
@media(max-width:850px){.enhancement-grid{grid-template-columns:1fr}.enhancement-card .action{align-self:flex-start}.evidence-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.comparison-grid{grid-template-columns:1fr}.artifact-showcase h1{font-size:2.3rem}.artifact-showcase section{margin-top:36px}.comparison-card,.enhancement-card{padding:20px}}


/* Simple academic presentation for the artifact evidence. */
.artifact-showcase .code-comparison pre{background:#f6f7f8;color:#172c3e;border:1px solid #d6e0e7;border-radius:3px;font:13px/1.65 Consolas,monospace;max-height:none;white-space:pre-wrap;overflow-wrap:anywhere;padding:16px}
.artifact-showcase .code-comparison figcaption{font-weight:600}.testing-results{padding-left:24px}.testing-results li{margin:8px 0}


/* Consistent typography across the portfolio. */
body,nav,main,footer,p,li,a,span,strong,em,figcaption,pre,code,table,th,td,.artifact-showcase .eyebrow,.artifact-showcase .lead,.artifact-showcase .validation-detail p{font-family:Arial,Helvetica,sans-serif!important;font-size:16px!important;line-height:1.7!important;letter-spacing:normal!important;text-transform:none!important}
h1,h2,h3,h4,h5,h6,.artifact-showcase h1,.artifact-showcase section h2{font-family:Arial,Helvetica,sans-serif!important;font-size:16px!important;line-height:1.7!important;letter-spacing:normal!important;font-weight:700!important}
p,li,pre,code{font-weight:400}pre,code{font:inherit!important}footer{color:var(--ink)}

</style>
</head>
<body>

</nav></header>
<main>{{ content }}</main>
<footer>Computer Science ePortfolio · Cybersecurity &amp; Data Analysis</footer>
</body></html>
